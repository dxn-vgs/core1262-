[platformio]
default_envs = transmitter

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  jgromes/RadioLib@^7.1.2

build_flags =
  -D RADIO_FREQ_MHZ=869.0
  -D RADIO_BITRATE_KBPS=25.0
  -D RADIO_DEVIATION_KHZ=25.0
  -D RADIO_RX_BW_KHZ=93.8
  -D RADIO_TX_POWER_DBM=22
  -D RADIO_PREAMBLE_BITS=64

[env:transmitter]
extends = env
build_flags =
  ${env.build_flags}
  -D RANGE_ROLE_TX=1

[env:receiver]
extends = env
build_flags =
  ${env.build_flags}
  -D RANGE_ROLE_TX=0
