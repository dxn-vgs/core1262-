[platformio]
default_envs = node_a

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  jgromes/RadioLib@^7.1.2

build_flags =
  -D RADIO_FREQ_MHZ=869.0
  -D RADIO_BITRATE_KBPS=25.0
  -D RADIO_DEVIATION_KHZ=25.0
  -D RADIO_RX_BW_KHZ=93.8
  -D RADIO_TX_POWER_DBM=22
  -D RADIO_PREAMBLE_BITS=64
  -D PING_INTERVAL_MS=1000
  -D REPLY_TIMEOUT_MS=600

[env:node_a]
extends = env
build_flags =
  ${env.build_flags}
  -D RANGE_ROLE_A=1

[env:node_b]
extends = env
build_flags =
  ${env.build_flags}
  -D RANGE_ROLE_A=0

; Backward-compatible environment names.
[env:transmitter]
extends = env:node_a

[env:receiver]
extends = env:node_b
